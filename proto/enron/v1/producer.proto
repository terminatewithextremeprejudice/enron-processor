// Control-plane contract for the `producer` service.
//
// Exposed over gRPC (plaintext, in-network, default :9000). The `api`
// service is the only caller:
//
//   POST /start  -> Producer.Start   (trigger / (re)ingest of the dataset)
//   GET  /status -> Producer.Status  (is the walk done? how far along?)
//
// This is an RPC, not a Kafka message, by design: the trigger has one
// well-defined owner (the producer) and needs a synchronous answer, so it
// belongs on the control plane. Kafka stays the data plane only.
syntax = "proto3";

package enron.v1;

option go_package = "github.com/terminatewithextremeprejudice/enron-processor/gen/enron/v1;enronv1";

// Where the producer's dataset walk currently stands.
enum ProducerState {
  // Never started (no walk has been requested yet).
  PRODUCER_STATE_UNSPECIFIED = 0;
  // No walk in flight. A Start request will begin one.
  PRODUCER_STATE_IDLE = 1;
  // Walk in flight: mail files are being discovered and envelopes emitted.
  PRODUCER_STATE_RUNNING = 2;
  // A walk completed: every discovered file has been emitted (or routed to
  // the DLQ). A subsequent Start begins a fresh walk; redelivery is safe
  // because downstream dedupes on RawEnvelope.idempotency_key.
  PRODUCER_STATE_FINISHED = 3;
}

// Producer is implemented by the `producer` service and consumed by the
// `api` service. Both RPCs must be safe to call at any time and from any
// number of concurrent callers.
service Producer {
  // Start (re-)ingestion of the dataset.
  //
  // Semantics: "ensure a walk is running".
  //   - state IDLE      -> starts a walk, returns started=true.
  //   - state RUNNING   -> no-op, returns started=false (already walking).
  //   - state FINISHED  -> starts a fresh walk, returns started=true.
  // The call returns as soon as the walk has been (re)started; the walk
  // itself continues in the background.
  rpc Start(StartRequest) returns (StartReply);

  // Current state plus progress counters of the current or most recent walk.
  rpc Status(StatusRequest) returns (StatusReply);
}

message StartRequest {
  // Audit: who triggered this, e.g. "api:POST /start from 1.2.3.4:5678".
  string triggered_by = 1;
}

message StartReply {
  // true when this call actually kicked off a walk; false when one was
  // already in flight (no-op).
  bool started = 1;

  // Producer state as observed immediately after the call.
  ProducerState state = 2;
}

message StatusRequest {
}

message StatusReply {
  ProducerState state = 1;

  // Mail files discovered by the current (or most recent) walk; 0 before
  // the first walk has reported anything.
  int64 total_mails = 2;

  // Envelopes successfully produced to the raw topic during the walk.
  int64 emitted = 3;

  // Envelopes routed to the DLQ during the walk.
  int64 dlq = 4;

  // Unix millis; 0 when not applicable to the current state.
  int64 walk_started_at_ms = 5;
  int64 walk_finished_at_ms = 6;
}
