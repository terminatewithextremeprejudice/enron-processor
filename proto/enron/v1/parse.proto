// Parser output contract: the normalized shape of one raw Enron mail file.
// The parser persists this shape directly into PostgreSQL (person, message,
// message_recipient) within the same component — there is no intermediate
// worker service.
syntax = "proto3";

package enron.v1;

option go_package = "github.com/terminatewithextremeprejudice/enron-processor/gen/enron/v1;enronv1";

// ParsedMessage is the normalized result of parsing one raw Enron mail file.
message ParsedMessage {
  // Carried over verbatim from RawEnvelope — the dedupe key end to end.
  string idempotency_key = 1;

  string source_path = 2;

  // Message-ID header value; empty when the mail has none.
  string message_id = 3;

  string sender_name = 4;
  string sender_email = 5;

  repeated Recipient to = 6;
  repeated Recipient cc = 7;
  repeated Recipient bcc = 8;
  repeated string reply_to = 9;

  string subject = 10;
  string body_text = 11;
  string body_html = 12;

  // Unix seconds; 0 when the header is absent or unparseable.
  int64 sent_at_unix = 13;
  int64 received_at_unix = 14;
}

message Recipient {
  string name = 1;
  string email = 2;
}
